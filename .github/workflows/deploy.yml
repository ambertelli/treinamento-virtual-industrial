name: Build and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Validate referenced training figures
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          const app = readFileSync('src/App.jsx', 'utf8');
          const block = app.match(/const figureFiles = \{([\s\S]*?)\};/);
          if (!block) {
            console.error('Could not find the figureFiles map in src/App.jsx');
            process.exit(1);
          }
          const names = [...block[1].matchAll(/:\s*"([^"]+\.jpg)"/g)].map(match => match[1]);
          const missing = names.filter(name => !existsSync(`public/figuras-rew450/${name}`));
          if (missing.length) {
            console.error('Missing training figures:', missing.join(', '));
            process.exit(1);
          }
          console.log(`Validated ${names.length} referenced figure files.`);
          NODE
      - name: Validate course lessons and assessments
        run: node scripts/validate-course.mjs
      - name: Copy original manual into the published site
        run: |
          mkdir -p public
          cp "Manual de Operação - Rebobinadeira REW-450 AFH.pdf" public/
          test -s "public/Manual de Operação - Rebobinadeira REW-450 AFH.pdf"
      - run: npm run build
      - name: Verify published manual is in build output
        run: test -s "dist/Manual de Operação - Rebobinadeira REW-450 AFH.pdf"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
